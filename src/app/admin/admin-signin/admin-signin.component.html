<div class="signin-wrapper animate__animated animate__fadeInUp">
  <div class="signin-card">
    <div class="brand-section">
      <div class="brand-logo">
        <i class="bi bi-shield-lock"></i>
      </div>
      <h2>Admin Access</h2>
      <p>Please enter your credentials to manage the platform</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="login()" autocomplete="off">
      <!-- Adminname Field -->
      <div class="form-group">
        <label class="form-label">Admin Username</label>
        <div class="input-wrapper">
          <i class="bi bi-person input-icon"></i>
          <input type="text" formControlName="adminname" class="form-control" placeholder="Enter username"
            [class.is-invalid]="loginForm.get('adminname')?.invalid && loginForm.get('adminname')?.touched">
        </div>
        <div class="error-message" *ngIf="loginForm.get('adminname')?.invalid && loginForm.get('adminname')?.touched">
          <i class="bi bi-exclamation-circle"></i> Username is required
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label class="form-label">Secure Password</label>
        <div class="input-wrapper">
          <i class="bi bi-key input-icon"></i>
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password" class="form-control"
            placeholder="••••••••"
            [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <button type="button" class="password-toggle" (click)="togglePasswordVisibility()">
            <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
          </button>
        </div>

        <div class="error-message" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <span *ngIf="loginForm.get('password')?.hasError('required')">
            <i class="bi bi-exclamation-circle"></i> Password is required
          </span>
          <span *ngIf="loginForm.get('password')?.hasError('minlength')">
            <i class="bi bi-exclamation-circle"></i> Minimum 8 characters needed
          </span>
          <span
            *ngIf="loginForm.get('password')?.hasError('pattern') && !loginForm.get('password')?.hasError('required')">
            <i class="bi bi-exclamation-circle"></i> Complex password required (U/L/N/S)
          </span>
        </div>
      </div>

      <!-- Sign In Button -->
      <button type="submit" class="btn-signin" [disabled]="loginForm.invalid || isSubmitting">
        <span *ngIf="!isSubmitting">Sign In to Dashboard <i class="bi bi-arrow-right-short"></i></span>
        <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm"></span>
      </button>

      <div class="footer-links">
        Don't have access? <span (click)="signup()">Register as Admin</span>
      </div>
    </form>
  </div>
</div>
