<div class="admin-page-container">
    <div class="page-header">
        <div class="back-nav" routerLink="/admin-home">
            <i class="bi bi-arrow-left"></i> <span>Dashboard</span>
        </div>
        <div class="header-info">
            <h1>Manage Destinations</h1>
            <p>Search and manage images by their district or location</p>
        </div>
    </div>

    <div class="search-section mb-5">
        <div class="search-card card border-0 shadow-sm">
            <div class="card-body p-4">
                <div class="row align-items-end g-3">
                    <div class="col-md-8">
                        <label class="form-label fw-bold">Enter District / Image Location</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                            <input type="text" [(ngModel)]="location" class="form-control border-start-0 ps-0"
                                placeholder="e.g. Madurai, Chennai, Kanyakumari..."
                                (keyup.enter)="getImagesByLocation()">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-primary w-100 py-2 fw-bold" (click)="getImagesByLocation()"
                            [disabled]="!location">
                            Search Records
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="results-area">
        <div class="row g-4" *ngIf="images.length > 0">
            <div class="col-md-6 col-lg-4" *ngFor="let image of images">
                <div class="destination-manage-card">
                    <div class="image-box">
                        <img [src]="getImageUrl(image.name) | secureImage | async" alt="{{image.name}}"
                            class="img-fluid">
                        <div class="location-badge">{{ location | uppercase }}</div>
                    </div>
                    <div class="p-3">
                        <h5 class="destination-name mb-3">{{ image.name | stripExtension }}</h5>
                        <div class="d-flex gap-2">
                            <button class="btn btn-outline-info flex-grow-1 btn-sm fw-bold"
                                (click)="updateImage(image)">
                                <i class="bi bi-pencil-square me-1"></i> Edit
                            </button>
                            <button class="btn btn-danger-soft btn-sm px-3" (click)="deleteImage(image.name)">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty / No Results -->
        <div *ngIf="images.length === 0" class="text-center py-5">
            <div class="empty-placeholder">
                <i class="bi bi-map"></i>
                <p class="text-muted mt-3">{{ location ? 'No images found for "' + location + '"' : 'Search for a
                    location to manage destinations' }}</p>
            </div>
        </div>
    </div>
</div>
