<div class="auth-container">
  <div class="modern-card">
    <!-- Image Side -->
    <div class="image-side">
      <img *ngIf="bookingImage" [src]="bookingImage" class="form-image" alt="Booking Destination">
      <div class="image-overlay">
        <h3>Your Journey Begins Here</h3>
        <p>Confirm your details to secure the best travel experience in Tamil Nadu.</p>
      </div>
    </div>

    <!-- Form Side -->
    <div class="form-side">
      <h2>Complete Booking</h2>
      <p class="subtitle">Just one more step to finalize your trip.</p>

      <form [formGroup]="bookForm" (ngSubmit)="postBooks()">
        <div class="form-grid">

          <!-- Booking ID & Date Row -->
          <div class="form-group">
            <label for="customId">Booking ID</label>
            <div class="input-wrapper">
              <i class="bi bi-hash input-icon"></i>
              <input type="number" id="customId" class="form-control" formControlName="customId" readonly>
            </div>
          </div>

          <div class="form-group">
            <label for="date">Date of Travel</label>
            <div class="input-wrapper">
              <i class="bi bi-calendar-event input-icon"></i>
              <input type="date" id="date" class="form-control" formControlName="date">
            </div>
            <div *ngIf="bookForm.get('date')?.invalid && bookForm.get('date')?.touched" class="error-msg">
              <i class="bi bi-exclamation-circle"></i> Date is required
            </div>
          </div>

          <!-- Name & Mobile Row -->
          <div class="form-group full-width">
            <label for="nameOfVisitor">Name of Visitor</label>
            <div class="input-wrapper">
              <i class="bi bi-person input-icon"></i>
              <input type="text" id="nameOfVisitor" class="form-control" formControlName="nameOfVisitor"
                placeholder="Enter your full name">
            </div>
            <div *ngIf="bookForm.get('nameOfVisitor')?.invalid && bookForm.get('nameOfVisitor')?.touched"
              class="error-msg">
              <i class="bi bi-exclamation-circle"></i> Visitor name is required
            </div>
          </div>

          <div class="form-group full-width">
            <label for="mobileNumber">Mobile Number</label>
            <div class="input-wrapper">
              <i class="bi bi-telephone input-icon"></i>
              <input type="tel" id="mobileNumber" class="form-control" formControlName="mobileNumber"
                placeholder="10-digit number" (keypress)="onlyNumbers($event)" maxlength="10">
            </div>
            <div *ngIf="bookForm.get('mobileNumber')?.invalid && bookForm.get('mobileNumber')?.touched"
              class="error-msg">
              <i class="bi bi-exclamation-circle"></i> Enter a valid 10-digit mobile number
            </div>
          </div>

          <!-- Places (Full Width) -->
          <div class="form-group full-width">
            <label for="visitingPlaces">Visiting Places</label>
            <div class="input-wrapper">
              <i class="bi bi-geo-alt input-icon"></i>
              <input type="text" id="visitingPlaces" class="form-control" formControlName="visitingPlaces" readonly>
            </div>
          </div>

          <!-- Days & Members Row -->
          <div class="form-group">
            <label for="noOfDays">Total Days</label>
            <div class="input-wrapper">
              <i class="bi bi-sun input-icon"></i>
              <input type="number" id="noOfDays" class="form-control" formControlName="noOfDays" placeholder="e.g. 3"
                min="1" max="10" (keypress)="onlyNumbers($event)">
            </div>
            <div *ngIf="bookForm.get('noOfDays')?.invalid && bookForm.get('noOfDays')?.touched" class="error-msg">
              <i class="bi bi-exclamation-circle"></i> Max 10 days allowed
            </div>
          </div>

          <div class="form-group">
            <label for="noOfMembers">Members</label>
            <div class="input-wrapper">
              <i class="bi bi-people input-icon"></i>
              <input type="number" id="noOfMembers" class="form-control" formControlName="noOfMembers"
                placeholder="e.g. 2" min="1" max="20" (keypress)="onlyNumbers($event)">
            </div>
            <div *ngIf="bookForm.get('noOfMembers')?.invalid && bookForm.get('noOfMembers')?.touched" class="error-msg">
              <i class="bi bi-exclamation-circle"></i> Max 20 members allowed
            </div>
          </div>

          <!-- Total Cost -->
          <div class="form-group full-width">
            <label>Total Estimated Cost</label>
            <div class="input-wrapper">
              <i class="bi bi-currency-rupee input-icon"></i>
              <input type="number" class="form-control" formControlName="totalCost" readonly
                style="font-weight: bold; color: #28a745;">
            </div>
          </div>

        </div>

        <!-- Actions -->
        <div class="form-grid mt-4">
          <button type="button" (click)="onCancel()" class="btn btn-secondary">Cancel</button>
          <button type="submit" [disabled]="bookForm.invalid" class="btn btn-primary">Confirm Booking</button>
        </div>

      </form>
    </div>
  </div>
</div>
