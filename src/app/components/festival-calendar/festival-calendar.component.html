<div class="festival-section py-5 bg-dark text-white">
    <div class="container">
        <div class="row align-items-center mb-5">
            <div class="col-md-7">
                <h2 class="display-5 fw-bold mb-3">Festival <span class="text-warning">Calendar</span></h2>
                <p class="lead opacity-75">Don't just visit, experience the soul of Tamil Nadu through its grand
                    festivals.</p>
            </div>
            <div class="col-md-5 text-md-end">
                <div class="live-indicator">
                    <span class="dot"></span> LIVE UPDATES 2026
                </div>
            </div>
        </div>

        <div class="festival-timeline">
            <div *ngFor="let fest of festivals" class="fest-card" [style.--fest-color]="fest.color">
                <div class="fest-date-box">
                    <span class="fest-date">{{ fest.date }}</span>
                </div>
                <div class="fest-body">
                    <div class="fest-icon"><i class="bi" [ngClass]="fest.icon"></i></div>
                    <div class="fest-info">
                        <h5>{{ fest.name }}</h5>
                        <p><i class="bi bi-geo-alt-fill me-1"></i> {{ fest.location }}</p>
                    </div>
                </div>
                <div class="fest-badge">
                    {{ getDaysUntil(fest.date) }}
                </div>
            </div>
        </div>
    </div>
</div>
