<div class="verify-container">
    <div class="card">
        <h2>Email Verification</h2>

        <div *ngIf="status === 'verifying'" class="status verifying">
            <div class="spinner"></div>
            <p>{{ message }}</p>
        </div>

        <div *ngIf="status === 'success'" class="status success">
            <i class="fa fa-check-circle"></i>
            <p>{{ message }}</p>
            <p class="sub-text">Redirecting to login...</p>
            <button routerLink="/signin" class="btn">Go to Login</button>
        </div>

        <div *ngIf="status === 'error'" class="status error">
            <i class="fa fa-times-circle"></i>
            <p>{{ message }}</p>
            <button routerLink="/signup" class="btn">Back to Signup</button>
        </div>
    </div>
</div>
