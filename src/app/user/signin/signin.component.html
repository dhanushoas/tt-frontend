<div class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Sign in to continue your journey</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="login()" class="auth-form">

        <!-- Email Field -->
        <div class="form-group">
          <label for="email" class="form-label">
            <i class="bi bi-envelope"></i> Email Address
          </label>
          <input type="email" id="email" formControlName="email" class="form-control" placeholder="your.email@gmail.com"
            autocomplete="email" />
          <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error-message">
            <small *ngIf="loginForm.get('email')?.hasError('required')">
              <i class="bi bi-exclamation-circle"></i> Email is required
            </small>
            <small *ngIf="loginForm.get('email')?.hasError('email')">
              <i class="bi bi-exclamation-circle"></i> Enter a valid email
            </small>
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password" class="form-label">
            <i class="bi bi-lock"></i> Password
          </label>
          <div class="password-input-wrapper">
            <input [type]="showPassword ? 'text' : 'password'" id="password" formControlName="password"
              class="form-control" placeholder="Enter your password" autocomplete="current-password" />
            <button type="button" class="password-toggle" (click)="togglePasswordVisibility()"
              aria-label="Toggle password visibility">
              <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
            </button>
          </div>
          <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-message">
            <small *ngIf="loginForm.get('password')?.hasError('required')">
              <i class="bi bi-exclamation-circle"></i> Password is required
            </small>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-block" [disabled]="loginForm.invalid || isLoading">
          <span *ngIf="!isLoading">
            <i class="bi bi-box-arrow-in-right"></i> Sign In
          </span>
          <span *ngIf="isLoading">
            <span class="spinner-border spinner-border-sm me-2"></span> Signing in...
          </span>
        </button>

        <!-- Divider -->
        <div class="divider">
          <span>OR</span>
        </div>

        <!-- Google Sign In -->
        <button type="button" class="btn btn-google btn-block" (click)="googleLogin()" [disabled]="isLoading">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48" class="me-2">
            <path fill="#EA4335"
              d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
            <path fill="#4285F4"
              d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
            <path fill="#FBBC05"
              d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
            <path fill="#34A853"
              d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
          </svg>
          Continue with Google
        </button>

        <!-- Sign Up Link -->
        <div class="auth-footer">
          Don't have an account?
          <a (click)="goToSignup()" class="auth-link">Sign Up</a>
        </div>
      </form>
    </div>
  </div>
</div>
